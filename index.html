html, body {
height: 100%;
background: #050507;
color: #f0f0f5;
font-family: 'Syne', sans-serif;
-webkit-font-smoothing: antialiased;
}

/* FOND AMBIANT */
.amb {
position: fixed; border-radius: 50%; pointer-events: none; filter: blur(90px); z-index: 0;
}
.amb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(100,80,255,0.12) 0%, transparent 70%); top: -150px; left: -100px; }
.amb-2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(0,212,255,0.07) 0%, transparent 70%); bottom: 0; right: -80px; }

/* PAGE */
.page {
position: relative;
z-index: 1;
height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 3rem;
padding: 2rem;
}

/* LOGO */
.logo {
font-size: clamp(4rem, 15vw, 9rem);
font-weight: 800;
letter-spacing: -0.05em;
line-height: 1;
animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s both;
}
.logo span { color: #6450ff; }

/* BOUTONS */
.btns {
display: flex;
flex-direction: column;
gap: 0.75rem;
width: 100%;
max-width: 320px;
animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.3s both;
}

.btn {
display: flex;
align-items: center;
justify-content: space-between;
padding: 1.1rem 1.4rem;
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 14px;
text-decoration: none;
color: #f0f0f5;
font-size: 1rem;
font-weight: 700;
letter-spacing: -0.01em;
transition: background 0.2s, border-color 0.2s, transform 0.2s;
-webkit-tap-highlight-color: transparent;
}
.btn:hover, .btn:active {
background: rgba(100,80,255,0.14);
border-color: rgba(100,80,255,0.45);
transform: translateY(-2px);
}
.btn svg {
width: 18px; height: 18px;
opacity: 0.5;
flex-shrink: 0;
}

@keyframes fadeUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
