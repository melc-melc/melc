.page {
height: 100vh;
width: 100%;
background-color: #050507;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 2.5rem;
padding: 2rem;
}

.logo {
font-family: 'Syne', sans-serif;
font-weight: 800;
font-size: clamp(5rem, 18vw, 11rem);
letter-spacing: -0.04em;
line-height: 1;
color: #f0f0f5;
animation: fadeUp 0.7s ease 0.1s both;
}
.logo span { color: #6450ff; }

.btns {
display: flex;
flex-direction: row;
gap: 0.9rem;
flex-wrap: wrap;
justify-content: center;
animation: fadeUp 0.7s ease 0.25s both;
}

.btn {
display: flex;
align-items: center;
gap: 0.5rem;
padding: 0.9rem 1.6rem;
background: #6450ff;
border: none;
border-radius: 100px;
text-decoration: none;
color: #fff;
font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
font-weight: 400;
font-size: 1rem;
white-space: nowrap;
box-shadow: 0 4px 24px rgba(100,80,255,0.4);
transition: background 0.2s, transform 0.2s;
-webkit-tap-highlight-color: transparent;
}
.btn:hover, .btn:active {
background: #7c6aff;
transform: translateY(-2px);
}
.btn svg { width: 15px; height: 15px; opacity: 0.8; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(18px); }
to { opacity: 1; transform: translateY(0); }
}
