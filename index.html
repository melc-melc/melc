```
html, body {
height: 100%;
background: #050507;
color: #f0f0f5;
-webkit-font-smoothing: antialiased;
}

.amb {
position: fixed; border-radius: 50%; pointer-events: none; filter: blur(90px); z-index: 0;
}
.amb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(100,80,255,0.13) 0%, transparent 70%); top: -150px; left: -100px; }
.amb-2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(0,212,255,0.07) 0%, transparent 70%); bottom: 0; right: -80px; }

.page {
position: relative;
z-index: 1;
height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 2.5rem;
padding: 2rem;
}

/* LOGO — Century Gothic bold via font-face stack */
.logo {
font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
font-weight: 900;
font-size: clamp(5rem, 18vw, 11rem);
letter-spacing: -0.04em;
line-height: 1;
color: #f0f0f5;
animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.1s both;
}
.logo span { color: #6450ff; }

/* BOUTONS EN LIGNE */
.btns {
display: flex;
flex-direction: row;
gap: 0.9rem;
flex-wrap: wrap;
justify-content: center;
animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s both;
}

.btn {
display: flex;
align-items: center;
gap: 0.5rem;
padding: 0.85rem 1.6rem;
background: #6450ff;
border: none;
border-radius: 100px;
text-decoration: none;
color: #fff;
font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
font-weight: 400;
font-size: clamp(0.85rem, 2.5vw, 1rem);
letter-spacing: 0.01em;
transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
-webkit-tap-highlight-color: transparent;
white-space: nowrap;
box-shadow: 0 4px 24px rgba(100,80,255,0.35);
}
.btn:hover, .btn:active {
background: #7c6aff;
transform: translateY(-2px);
box-shadow: 0 8px 32px rgba(100,80,255,0.5);
}
.btn svg { width: 15px; height: 15px; opacity: 0.75; flex-shrink: 0; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(18px); }
to { opacity: 1; transform: translateY(0); }
}
