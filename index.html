<html lang="fr">

    html, body {
      height: 100%; width: 100%;
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s, color 0.4s;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.8rem;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 12vw, 8rem);
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
      text-align: center;
      opacity: 0;
      filter: blur(14px);
      transform: scale(0.93);
      animation: logoIn 1s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }
    .logo span { color: #6450ff; }

    .tagline {
      font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
      font-weight: 400;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.6s ease 0.9s forwards;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
      max-width: 440px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      background: var(--card-bg);
      border: 0.5px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      opacity: 0;
      transform: translateY(16px);
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover {
      background: rgba(100,80,255,0.1);
      border-color: rgba(100,80,255,0.35);
      transform: translateY(-2px);
    }

    .card:nth-child(2) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 1.25s forwards; }
