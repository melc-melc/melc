<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>melc.</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      height: 100%; width: 100%;
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s, color 0.4s;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.8rem;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 12vw, 8rem);
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
      text-align: center;
      opacity: 0;
      filter: blur(14px);
      transform: scale(0.93);
      animation: logoIn 1s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }
    .logo span { color: #6450ff; }

    .tagline {
      font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
      font-weight: 400;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.6s ease 0.9s forwards;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
      max-width: 440px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      background: var(--card-bg);
      border: 0.5px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      opacity: 0;
      transform: translateY(16px);
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover {
      background: rgba(100,80,255,0.1);
      border-color: rgba(100,80,255,0.35);
      transform: translateY(-2px);
    }
    .card:nth-child(1) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 1.1s forwards; }
    .card:nth-child(2) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 1.25s forwards; }
    .card:nth-child(3) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 1.4s forwards; }

    .card-left {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .card-num {
      font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      color: rgba(100,80,255,0.65);
      letter-spacing: 0.14em;
    }
    .card-label {
      font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 3vw, 1.15rem);
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .card-sub {
      font-family: 'Century Gothic', 'AppleGothic', 'Trebuchet MS', sans-serif;
      font-weight: 400;
      font-size: 0.77rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .card-arrow {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(100,80,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.2s;
    }
    .card:hover .card-arrow {
      background: rgba(100,80,255,0.3);
      transform: translateX(3px);
    }
    .card-arrow svg { width: 13px; height: 13px; }

    @keyframes logoIn {
      to { opacity: 1; filter: blur(0); transform: scale(1); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* variables dark par défaut */
    :root {
      --bg: #050507;
      --text: #f0f0f5;
      --text-muted: rgba(240,240,245,0.35);
      --card-bg: rgba(255,255,255,0.03);
      --card-border: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="logo">melc<span>.</span></div>
      <div class="tagline">De l'idée au réel.</div>
    </div>

    <div class="cards">
      <a href="creations.html" class="card">
        <div class="card-left">
          <span class="card-num">01</span>
          <span class="card-label">Mes créations</span>
          <span class="card-sub">Projets, réalisations & expériences</span>
        </div>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6450ff" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>

      <a href="histoire.html" class="card">
        <div class="card-left">
          <span class="card-num">02</span>
          <span class="card-label">Mon histoire</span>
          <span class="card-sub">Parcours, vision & motivations</span>
        </div>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6450ff" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>

      <a href="mailto:contact@melc.fr" class="card">
        <div class="card-left">
          <span class="card-num">03</span>
          <span class="card-label">Me contacter</span>
          <span class="card-sub">Discutons de ton projet</span>
        </div>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6450ff" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
